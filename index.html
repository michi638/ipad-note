<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f1ea">
<title>音声文字起こしノート</title>
<style>
:root{
  --bg:#eeeae1; --paper:#fffef9; --ink:#252525; --muted:#6d6a63;
  --line:#d8d3c8; --accent:#2767d8; --danger:#b3261e;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
  max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.app{max-width:1100px;margin:auto}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:clamp(20px,3vw,30px);margin:0 auto 0 0}
.status{font-size:14px;color:var(--muted);min-width:130px}
.toolbar,.drawbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input[type="color"],input[type="range"]{
  min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;
  font-size:16px;padding:8px 12px;color:var(--ink)
}
button{font-weight:650;cursor:pointer}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}
button.danger{color:var(--danger)}
button.active{outline:3px solid rgba(39,103,216,.25);border-color:var(--accent)}
button:disabled{opacity:.45}
.meta{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
#title{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:18px;width:100%}
.workspace{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);overflow:hidden;height:min(68vh,780px);min-height:430px}
#editor{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;
  padding:34px 36px 80px;font-size:21px;line-height:1.8;background:
  repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.8em - 1px),#ebe7de calc(1.8em - 1px),#ebe7de 1.8em);
  color:var(--ink);caret-color:var(--accent);overflow:auto}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none}
.drawbar{margin-top:10px;background:rgba(255,255,255,.75);padding:8px;border-radius:14px}
.drawbar label{display:flex;align-items:center;gap:6px;font-size:14px}
.spacer{flex:1}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 0;line-height:1.5}
#interim{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(20,20,20,.86);color:#fff;border-radius:14px;padding:10px 15px;max-width:88vw;
  font-size:16px;display:none;z-index:9}
@media(max-width:650px){
  #editor{padding:24px 18px 70px;font-size:18px}
  .workspace{height:64vh}
  button,select{font-size:15px;padding:7px 10px}
}
@media print{
  body{background:#fff;padding:0}.toolbar,.drawbar,.hint,.meta button,.status{display:none!important}
  .workspace{border:0;box-shadow:none;height:auto;min-height:90vh}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>音声文字起こしノート</h1>
  <span class="status" id="status">待機中</span>
  <div class="toolbar">
    <button class="primary" id="mic">🎙 文字起こし開始</button>
    <button id="stop" disabled>■ 停止</button>
    <select id="lang" aria-label="認識言語">
      <option value="ja-JP">日本語</option>
      <option value="en-US">英語</option>
    </select>
    <button id="save">保存</button>
    <button id="load">読込</button>
    <button id="exportTxt">TXT</button>
    <button id="exportHtml">HTML</button>
  </div>
</header>

<div class="meta">
  <input id="title" value="新しいノート" aria-label="文書タイトル">
  <button class="danger" id="newDoc">新規</button>
</div>

<div class="workspace" id="workspace">
  <textarea id="editor" spellcheck="true" placeholder="ここに文字起こし結果が入ります。キーボードでも自由に編集できます。"></textarea>
  <canvas id="canvas" aria-label="手書き注釈レイヤー"></canvas>
</div>

<div class="drawbar">
  <button id="textMode" class="active">⌨️ 文字編集</button>
  <button id="penMode">✏️ ペン</button>
  <button id="highlighterMode">🖍 蛍光ペン</button>
  <button id="eraserMode">消しゴム</button>
  <label>色 <input type="color" id="color" value="#d92121"></label>
  <label>太さ <input type="range" id="width" min="1" max="24" value="4"></label>
  <span class="spacer"></span>
  <button id="undo">↶ 戻す</button>
  <button id="clearInk" class="danger">注釈消去</button>
  <button id="exportPng">画像保存</button>
</div>

<p class="hint">
Safariで開き、最初の使用時にマイクを許可してください。音声認識にはSiri／音声入力が有効である必要があります。
「ホーム画面に追加」した状態で音声認識できない場合は、Safariの通常タブで開いてください。
</p>
</div>
<div id="interim"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const editor=$('editor'), canvas=$('canvas'), ctx=canvas.getContext('2d');
const workspace=$('workspace'), statusEl=$('status'), interimEl=$('interim');
let recognition=null, listening=false, manualStop=false;
let drawing=false, mode='text', points=[], history=[], saveTimer=null;

function setStatus(t){statusEl.textContent=t}
function stamp(){return new Date().toLocaleString('ja-JP')}

function resizeCanvas(){
  const old = document.createElement('canvas');
  old.width=canvas.width; old.height=canvas.height;
  if(old.width && old.height) old.getContext('2d').drawImage(canvas,0,0);
  const r=workspace.getBoundingClientRect(), dpr=Math.max(1,window.devicePixelRatio||1);
  canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
  canvas.style.width=r.width+'px'; canvas.style.height=r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(old.width && old.height) ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);
}
new ResizeObserver(resizeCanvas).observe(workspace);

function setMode(next){
  mode=next;
  canvas.style.pointerEvents = next==='text' ? 'none' : 'auto';
  editor.style.pointerEvents = next==='text' ? 'auto' : 'none';
  ['textMode','penMode','highlighterMode','eraserMode'].forEach(id=>$(id).classList.remove('active'));
  $({text:'textMode',pen:'penMode',highlighter:'highlighterMode',eraser:'eraserMode'}[next]).classList.add('active');
}
$('textMode').onclick=()=>setMode('text');
$('penMode').onclick=()=>setMode('pen');
$('highlighterMode').onclick=()=>setMode('highlighter');
$('eraserMode').onclick=()=>setMode('eraser');

function pos(e){
  const r=canvas.getBoundingClientRect();
  const p=e.touches?.[0]||e;
  return {x:p.clientX-r.left,y:p.clientY-r.top};
}
function snapshot(){
  history.push(canvas.toDataURL());
  if(history.length>25)history.shift();
}
function startDraw(e){
  e.preventDefault(); snapshot(); drawing=true; points=[pos(e)];
}
function moveDraw(e){
  if(!drawing)return; e.preventDefault();
  const p=pos(e), prev=points[points.length-1]; points.push(p);
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  if(mode==='eraser'){
    ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=Number($('width').value)*2.5;
  }else{
    ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle=$('color').value;
    ctx.globalAlpha=mode==='highlighter'?.28:1;
    ctx.lineWidth=mode==='highlighter'?Number($('width').value)*3:Number($('width').value);
  }
  ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore();
}
function endDraw(){ if(drawing){drawing=false; autosave();} }
canvas.addEventListener('pointerdown',startDraw);
canvas.addEventListener('pointermove',moveDraw);
window.addEventListener('pointerup',endDraw);
$('undo').onclick=()=>{
  const src=history.pop(); if(!src)return;
  const im=new Image(); im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,workspace.clientWidth,workspace.clientHeight);autosave()};im.src=src;
};
$('clearInk').onclick=()=>{if(confirm('手書き注釈をすべて消去しますか？')){snapshot();ctx.clearRect(0,0,canvas.width,canvas.height);autosave()}};

function insertText(text){
  const start=editor.selectionStart, end=editor.selectionEnd;
  const prefix=(start>0 && !/\s$/.test(editor.value.slice(0,start)))?'':'';
  editor.setRangeText(prefix+text,start,end,'end');
  editor.dispatchEvent(new Event('input'));
  editor.scrollTop=editor.scrollHeight;
}

function setupRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ setStatus('音声認識非対応'); $('mic').disabled=true; return; }
  recognition=new SR();
  recognition.lang=$('lang').value;
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;
  recognition.onstart=()=>{listening=true;setStatus('認識中…');$('mic').disabled=true;$('stop').disabled=false};
  recognition.onresult=e=>{
    let finalText='', interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText+=t;
      else interim+=t;
    }
    if(finalText) insertText(finalText+'。');
    interimEl.textContent=interim;
    interimEl.style.display=interim?'block':'none';
  };
  recognition.onerror=e=>{
    const msg={not_allowed:'マイクが許可されていません',audio_capture:'マイクを確認してください',
      network:'通信エラー',no_speech:'音声を検出できませんでした'}[e.error]||('認識エラー: '+e.error);
    setStatus(msg);
    if(e.error==='not-allowed'||e.error==='service-not-allowed') manualStop=true;
  };
  recognition.onend=()=>{
    listening=false; interimEl.style.display='none';
    if(!manualStop){
      setTimeout(()=>{try{recognition.start()}catch(_){}},350);
    }else{
      setStatus('停止');$('mic').disabled=false;$('stop').disabled=true;
    }
  };
}
setupRecognition();

$('lang').onchange=()=>{if(recognition)recognition.lang=$('lang').value};
$('mic').onclick=()=>{
  manualStop=false; 
  try{recognition.lang=$('lang').value;recognition.start()}catch(e){setStatus('開始できません。少し待って再度お試しください')}
};
$('stop').onclick=()=>{manualStop=true;try{recognition.stop()}catch(_){}};

const KEY='ipadVoiceNote.v1';
function project(){
  return {version:1,title:$('title').value,text:editor.value,ink:canvas.toDataURL('image/png'),updatedAt:new Date().toISOString()};
}
function saveLocal(show=true){
  try{localStorage.setItem(KEY,JSON.stringify(project())); if(show)setStatus('保存しました '+stamp())}
  catch(e){setStatus('保存容量が不足しています')}
}
function autosave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveLocal(false),500)}
editor.addEventListener('input',autosave);$('title').addEventListener('input',autosave);$('save').onclick=()=>saveLocal(true);

function loadLocal(show=true){
  const raw=localStorage.getItem(KEY);
  if(!raw){if(show)alert('保存されたノートはありません。');return}
  try{
    const d=JSON.parse(raw);$('title').value=d.title||'無題';editor.value=d.text||'';
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(d.ink){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,workspace.clientWidth,workspace.clientHeight);im.src=d.ink}
    if(show)setStatus('読み込みました');
  }catch(e){alert('保存データを読み込めませんでした。')}
}
$('load').onclick=()=>loadLocal(true);
$('newDoc').onclick=()=>{if(confirm('現在の内容を消して新しいノートを作りますか？')){$('title').value='新しいノート';editor.value='';ctx.clearRect(0,0,canvas.width,canvas.height);localStorage.removeItem(KEY);setStatus('新規ノート')}};

function safeName(s){return (s||'note').replace(/[\\/:*?"<>|]/g,'_').slice(0,60)}
function download(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
$('exportTxt').onclick=()=>download(new Blob([editor.value],{type:'text/plain;charset=utf-8'}),safeName($('title').value)+'.txt');

$('exportHtml').onclick=()=>{
  const ink=canvas.toDataURL('image/png');
  const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const doc=`<!doctype html><meta charset="utf-8"><title>${esc($('title').value)}</title>
  <style>body{font-family:-apple-system,"Hiragino Sans",sans-serif;max-width:850px;margin:40px auto;padding:20px;line-height:1.8}
  .paper{position:relative;white-space:pre-wrap;font-size:20px}.ink{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}</style>
  <h1>${esc($('title').value)}</h1><div class="paper">${esc(editor.value)}<img class="ink" src="${ink}"></div>`;
  download(new Blob([doc],{type:'text/html;charset=utf-8'}),safeName($('title').value)+'.html');
};

$('exportPng').onclick=()=>{
  const out=document.createElement('canvas'), dpr=2;
  out.width=workspace.clientWidth*dpr;out.height=workspace.clientHeight*dpr;
  const c=out.getContext('2d');c.scale(dpr,dpr);c.fillStyle='#fffef9';c.fillRect(0,0,workspace.clientWidth,workspace.clientHeight);
  c.fillStyle='#252525';c.font='20px -apple-system, Hiragino Sans, sans-serif';c.textBaseline='top';
  const max=workspace.clientWidth-72, lh=36, paras=editor.value.split('\n');let y=34;
  for(const para of paras){
    let line='';
    for(const ch of para){
      if(c.measureText(line+ch).width>max){c.fillText(line,36,y);line=ch;y+=lh}else line+=ch;
    }
    c.fillText(line,36,y);y+=lh;if(y>workspace.clientHeight-30)break;
  }
  c.drawImage(canvas,0,0,workspace.clientWidth,workspace.clientHeight);
  out.toBlob(b=>download(b,safeName($('title').value)+'.png'),'image/png');
};
window.addEventListener('beforeunload',()=>saveLocal(false));
setTimeout(()=>loadLocal(false),100);
</script>
</body>
</html>
